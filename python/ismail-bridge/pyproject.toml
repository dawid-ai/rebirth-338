[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reborn-sidecar"
version = "0.2.0"
description = "Optional audio analysis sidecar for RE:BORN, with a builtin numpy backend and an adapter for the Ismail module."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
reborn-sidecar = "reborn_sidecar.__main__:main"

[tool.setuptools.packages.find]
include = ["reborn_sidecar*"]
