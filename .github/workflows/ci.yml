name: CI

on:
  push:
    branches: [main, reborn-v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: python -m unittest discover -s python/ismail-bridge/tests
      - run: npm run build
      - run: npm run desktop:build
